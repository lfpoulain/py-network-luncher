[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py-network-launcher"
dynamic = ["version"]
description = "Orchestration de séquences d'actions entre postes Windows d'un même réseau local"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "LFPoulain" }]
requires-python = ">=3.11"
classifiers = [
  "Environment :: Win32 (MS Windows)",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "License :: Other/Proprietary License",
]
dependencies = [
  "flet==1.0.5",
  "flet-desktop==1.0.5; platform_system == 'Windows' or platform_system == 'Darwin'",
  "Pillow>=10,<14",
  "pystray>=0.19,<0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]
build = [
  "pyinstaller>=6,<7",
]
web = [
  "flet-web==1.0.5", # option --web (développement)
]

[project.scripts]
py-network-launcher = "py_network_launcher.app:main"

[project.urls]
Homepage = "https://github.com/lfpoulain/py-network-luncher"
Releases = "https://github.com/lfpoulain/py-network-luncher/releases"

[tool.setuptools.dynamic]
version = { attr = "py_network_launcher.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 160
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "E501",   # longueur gérée par `ruff format` ; les textes d'interface restent sur une ligne
  "RUF001", # caractères typographiques français (’, «, ») voulus dans les textes
  "RUF002",
  "RUF003",
  "SIM105", # contextlib.suppress n'apporte rien ici
  "UP007",  # Optional[X] conservé pour la lisibilité
  "UP045",
]

[tool.ruff.lint.isort]
known-first-party = ["py_network_launcher"]
