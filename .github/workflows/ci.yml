name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint et tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Ruff (lint)
        run: python -m ruff check .

      - name: Ruff (format)
        run: python -m ruff format --check .

      - name: Pytest
        run: python -m pytest

  build:
    name: Build Windows
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Construire
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Publier les artefacts du build
        uses: actions/upload-artifact@v7
        with:
          name: py-network-launcher-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
