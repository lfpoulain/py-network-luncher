name: Release

# Déclenché par le push d'un tag vX.Y.Z (créé par `python scripts/release.py prepare X.Y.Z`).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Publier ${{ github.ref_name }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Vérifier la cohérence tag / version / changelog
        run: python scripts/release.py check ${{ github.ref_name }}

      - name: Installer
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Lint et tests
        run: |
          python -m ruff check .
          python -m pytest

      - name: Installer Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Construire
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Notes de version
        run: python scripts/release.py notes ${{ github.ref_name }} --output dist/RELEASE_NOTES.md

      - name: Créer la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: Py Network Launcher ${{ github.ref_name }}
          body_path: dist/RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt
