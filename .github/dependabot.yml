version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Flet change souvent d'API : montée de version à faire à la main, avec test de l'interface.
      - dependency-name: "flet*"
